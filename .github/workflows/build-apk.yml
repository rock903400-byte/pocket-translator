name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore (only when the secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/pocket_translator.jks
            echo "Signing keystore restored."
          else
            echo "POCKET_KEYSTORE_BASE64 not set; build falls back to the default debug signature."
          fi

      - name: Run Unit Tests
        run: gradle test --stacktrace
        env:
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PocketTranslator-Debug.apk
          echo "APK generated at output/PocketTranslator-Debug.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketTranslator-Debug-APK
          path: output/PocketTranslator-Debug.apk
          retention-days: 14
